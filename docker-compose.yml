services:
  postgres:
    image: postgres:16-alpine
    container_name: api-pedidos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - api_pedidos_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:8.0.28-noble
    container_name: api-pedidos-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    ports:
      - "${MONGO_PORT:-27017}:27017"

    volumes:
      - api_pedidos_mongo_data:/data/db

    healthcheck:
      test: >
        mongosh --quiet
        --username "$$MONGO_INITDB_ROOT_USERNAME"
        --password "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin
        --eval "db.adminCommand('ping').ok"
        | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: api-pedidos-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}

    ports:
      - "${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"

    volumes:
      - api_pedidos_rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-de-pedidos:
    profiles:
      - full

    build:
      context: .
      dockerfile: Dockerfile

    image: api-de-pedidos:local
    container_name: api-pedidos-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: homolog

      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_RENEW_BEFORE_EXPIRATION: ${JWT_RENEW_BEFORE_EXPIRATION}

      FAKE_WEBHOOK_SECRET: ${FAKE_WEBHOOK_SECRET}

      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTHENTICATION_DATABASE: ${MONGO_AUTHENTICATION_DATABASE:-admin}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_MANAGEMENT_PORT: ${RABBITMQ_MANAGEMENT_PORT:-15672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}

    ports:
      - "${API_PORT:-8080}:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://localhost:8080/actuator/health/readiness"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  prometheus:
    profiles:
      - full

    image: prom/prometheus:v3.14.0
    container_name: api-pedidos-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.page-title=API de Pedidos - Prometheus"

    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - api_pedidos_prometheus_data:/prometheus

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:9090/-/ready || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    profiles:
      - full

    image: grafana/grafana:13.1.1
    container_name: api-pedidos-grafana
    restart: unless-stopped

    depends_on:
      prometheus:
        condition: service_healthy

    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}"

      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"

      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

      GF_LOG_MODE: "console"
      GF_LOG_LEVEL: "info"

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

    volumes:
      - api_pedidos_grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --output /dev/null http://localhost:3000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  api_pedidos_postgres_data:
  api_pedidos_mongo_data:
  api_pedidos_prometheus_data:
  api_pedidos_grafana_data:
  api_pedidos_rabbitmq_data: