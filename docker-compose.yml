services:
  postgres:
    image: postgres:16-alpine
    container_name: api-pedidos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - api_pedidos_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:8.2.12-noble
    container_name: api-pedidos-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    ports:
      - "${MONGO_PORT:-27017}:27017"

    volumes:
      - api_pedidos_mongo_data:/data/db

    healthcheck:
      test: >
        mongosh --quiet
        --username "$$MONGO_INITDB_ROOT_USERNAME"
        --password "$$MONGO_INITDB_ROOT_PASSWORD"
        --authenticationDatabase admin
        --eval "db.adminCommand('ping').ok"
        | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api-de-pedidos:
    profiles:
      - full

    build:
      context: .
      dockerfile: Dockerfile

    image: api-de-pedidos:local
    container_name: api-pedidos-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: homolog

      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_RENEW_BEFORE_EXPIRATION: ${JWT_RENEW_BEFORE_EXPIRATION}

      FAKE_WEBHOOK_SECRET: ${FAKE_WEBHOOK_SECRET}

      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_AUTHENTICATION_DATABASE: ${MONGO_AUTHENTICATION_DATABASE:-admin}

    ports:
      - "${API_PORT:-8080}:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://localhost:8080/actuator/health/readiness"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  api_pedidos_postgres_data:
  api_pedidos_mongo_data: