# Properties para homologacao, utilizando banco PostgreSQL

# Spring Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console H2
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# MongoDB operacional
spring.data.mongodb.host=${MONGO_HOST}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.username=${MONGO_USERNAME}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.authentication-database=${MONGO_AUTHENTICATION_DATABASE:admin}
spring.data.mongodb.auto-index-creation=true

# JWT
api.security.token.chave-secreta=${JWT_SECRET}
api.security.token.expiracao=${JWT_EXPIRATION}
api.security.token.expiracao-refresh=${JWT_REFRESH_EXPIRATION}
api.security.token.tempo-antes-expiracao-para-renovar=${JWT_RENEW_BEFORE_EXPIRATION}

# WEBHOOK
api.webhook.fake.secret=${FAKE_WEBHOOK_SECRET}

# OpenAPI / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true

# Micrometer / Prometheus
management.prometheus.metrics.export.enabled=true

# Permite coleta pelo Prometheus da rede de homologacao.
api.observabilidade.prometheus-publico=true

# Nao expor detalhes de infraestrutura publicamente.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.max-interval=5000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
logging.level.org.springframework.amqp.rabbit.listener=INFO

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topico-pedidos=${KAFKA_TOPIC_PEDIDOS:api.pedidos.eventos.v1}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.api.pedidos.messaging.dto
spring.kafka.consumer.properties.spring.json.value.default.type=br.com.api.pedidos.messaging.dto.PedidoEventoKafkaMensagem
spring.kafka.listener.ack-mode=record
app.kafka.grupo-integracao=${KAFKA_CONSUMER_GROUP_INTEGRACAO:api-pedidos-integracao-v1}
app.kafka.grupo-analytics=${KAFKA_CONSUMER_GROUP_ANALYTICS:api-pedidos-analytics-v1}
app.kafka.consumer-concurrency=${KAFKA_CONSUMER_CONCURRENCY:3}
app.kafka.retry-concurrency=${KAFKA_RETRY_CONCURRENCY:1}

app.kafka.outbox.intervalo-ms=${KAFKA_OUTBOX_INTERVAL_MS:1000}

# Logs
logging.level.root=INFO
logging.level.br.com.api.pedidos=INFO