# Properties para homologacao, utilizando banco PostgreSQL

# Spring Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console H2
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
api.security.token.chave-secreta=${JWT_SECRET}
api.security.token.expiracao=${JWT_EXPIRATION}
api.security.token.expiracao-refresh=${JWT_REFRESH_EXPIRATION}
api.security.token.tempo-antes-expiracao-para-renovar=${JWT_RENEW_BEFORE_EXPIRATION}

# WEBHOOK
api.webhook.fake.secret=${FAKE_WEBHOOK_SECRET}
