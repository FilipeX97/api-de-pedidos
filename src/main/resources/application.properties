spring.application.name=api-de-pedidos

# Profile
spring.profiles.default=dev

# Docker Compose desabilitado por padrão
spring.docker.compose.enabled=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Hibernate somente valida o schema criado pelo Flyway
spring.jpa.hibernate.ddl-auto=validate

# JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true

#Actuator / Observabilidade

# Endpoints expostos por padrao.
management.endpoints.web.exposure.include=health,info

# Habilita os grupos de liveness e readiness fora do Kubernetes.
management.endpoint.health.probes.enabled=true

# Liveness verifica somente se a aplicacao continua viva.
management.endpoint.health.group.liveness.include=livenessState

# Readiness verifica se a aplicacao esta pronta e se acessa o banco.
management.endpoint.health.group.readiness.include=readinessState,db

# Configuracao segura por padrao.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Permite mostrar propriedades info.* no /actuator/info.
management.info.env.enabled=true

# Informacoes publicas da aplicacao.
info.app.name=${spring.application.name}
info.app.description=API REST para gerenciamento de pedidos e pagamentos

# Padrao de log com Request ID.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [requestId=%X{requestId:-sem-request-id}] [%thread] %logger{36} - %msg%n