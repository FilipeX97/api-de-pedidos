# Properties para producao, utilizando banco PostgreSQL

# Spring Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Console H2
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# MongoDB operacional
spring.data.mongodb.host=${MONGO_HOST}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.username=${MONGO_USERNAME}
spring.data.mongodb.password=${MONGO_PASSWORD}
spring.data.mongodb.authentication-database=${MONGO_AUTHENTICATION_DATABASE:admin}
spring.data.mongodb.auto-index-creation=true

# JWT
api.security.token.chave-secreta=${JWT_SECRET}
api.security.token.expiracao=${JWT_EXPIRATION}
api.security.token.expiracao-refresh=${JWT_REFRESH_EXPIRATION}
api.security.token.tempo-antes-expiracao-para-renovar=${JWT_RENEW_BEFORE_EXPIRATION}

# WEBHOOK
api.webhook.fake.secret=${FAKE_WEBHOOK_SECRET}

# OpenAPI / Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info

# Nunca expor detalhes internos em producao.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Logs
logging.level.root=INFO
logging.level.br.com.api.pedidos=INFO
logging.level.org.springframework.security=WARN