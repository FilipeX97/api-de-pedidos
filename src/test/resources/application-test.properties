# Properties para teste, utilizando banco H2

# Spring Datasource
spring.datasource.url=jdbc:h2:mem:api_pedidos_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT
api.security.token.chave-secreta=${random.uuid}${random.uuid}
api.security.token.expiracao=900000
api.security.token.expiracao-refresh=604800000
api.security.token.tempo-antes-expiracao-para-renovar=300000

# WEBHOOK
api.webhook.fake.secret=${random.uuid}${random.uuid}

# OpenAPI / Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false