# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# MongoDB
spring.data.mongodb.auto-index-creation=true

# JWT
api.security.token.chave-secreta=${INTEGRATION_JWT_SECRET}
api.security.token.expiracao=900000
api.security.token.expiracao-refresh=604800000
api.security.token.tempo-antes-expiracao-para-renovar=300000

# WEBHOOK
api.webhook.fake.secret=${INTEGRATION_FAKE_WEBHOOK_SECRET}

# Swagger
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always

# O endpoint Prometheus poderá ser testado sem JWT
api.observabilidade.prometheus-publico=true