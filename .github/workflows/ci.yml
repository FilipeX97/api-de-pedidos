name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: "temurin"

jobs:
  validar-configuracao-ci:
    name: CI / Configuração
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      CI_FAKE_WEBHOOK_SECRET: ${{ secrets.CI_FAKE_WEBHOOK_SECRET }}
      CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

      CI_DB_NAME: ${{ vars.CI_DB_NAME }}
      CI_DB_USERNAME: ${{ vars.CI_DB_USERNAME }}
      CI_DB_PORT: ${{ vars.CI_DB_PORT }}
      CI_API_PORT: ${{ vars.CI_API_PORT }}
      CI_JWT_EXPIRATION: ${{ vars.CI_JWT_EXPIRATION }}
      CI_JWT_REFRESH_EXPIRATION: ${{ vars.CI_JWT_REFRESH_EXPIRATION }}
      CI_JWT_RENEW_BEFORE_EXPIRATION: ${{ vars.CI_JWT_RENEW_BEFORE_EXPIRATION }}

      CI_MONGO_PASSWORD: ${{ secrets.CI_MONGO_PASSWORD }}

      CI_MONGO_DATABASE: ${{ vars.CI_MONGO_DATABASE }}
      CI_MONGO_USERNAME: ${{ vars.CI_MONGO_USERNAME }}
      CI_MONGO_PORT: ${{ vars.CI_MONGO_PORT }}
      CI_MONGO_AUTHENTICATION_DATABASE: >-
        ${{ vars.CI_MONGO_AUTHENTICATION_DATABASE }}

    steps:
      - name: Validar Secrets e Variables obrigatórios
        shell: bash
        run: |
          set -euo pipefail

          configuracoes_ausentes=()

          [[ -n "${CI_JWT_SECRET:-}" ]] ||
            configuracoes_ausentes+=("Secret CI_JWT_SECRET")

          [[ -n "${CI_FAKE_WEBHOOK_SECRET:-}" ]] ||
            configuracoes_ausentes+=("Secret CI_FAKE_WEBHOOK_SECRET")

          [[ -n "${CI_DB_PASSWORD:-}" ]] ||
            configuracoes_ausentes+=("Secret CI_DB_PASSWORD")

          [[ -n "${CI_DB_NAME:-}" ]] ||
            configuracoes_ausentes+=("Variable CI_DB_NAME")

          [[ -n "${CI_DB_USERNAME:-}" ]] ||
            configuracoes_ausentes+=("Variable CI_DB_USERNAME")

          [[ -n "${CI_DB_PORT:-}" ]] ||
            configuracoes_ausentes+=("Variable CI_DB_PORT")

          [[ -n "${CI_API_PORT:-}" ]] ||
            configuracoes_ausentes+=("Variable CI_API_PORT")
          
          [[ -n "${CI_MONGO_PASSWORD:-}" ]] ||
            configuracoes_ausentes+=("Secret CI_MONGO_PASSWORD")

          [[ -n "${CI_MONGO_DATABASE:-}" ]] ||
            configuracoes_ausentes+=("Variable CI_MONGO_DATABASE")

          [[ -n "${CI_MONGO_USERNAME:-}" ]] ||
            configuracoes_ausentes+=("Variable CI_MONGO_USERNAME")

          [[ -n "${CI_MONGO_PORT:-}" ]] ||
            configuracoes_ausentes+=("Variable CI_MONGO_PORT")

          [[ -n "${CI_MONGO_AUTHENTICATION_DATABASE:-}" ]] ||
            configuracoes_ausentes+=(
              "Variable CI_MONGO_AUTHENTICATION_DATABASE"
            )

          [[ -n "${CI_JWT_EXPIRATION:-}" ]] ||
            configuracoes_ausentes+=("Variable CI_JWT_EXPIRATION")

          [[ -n "${CI_JWT_REFRESH_EXPIRATION:-}" ]] ||
            configuracoes_ausentes+=(
              "Variable CI_JWT_REFRESH_EXPIRATION"
            )

          [[ -n "${CI_JWT_RENEW_BEFORE_EXPIRATION:-}" ]] ||
            configuracoes_ausentes+=(
              "Variable CI_JWT_RENEW_BEFORE_EXPIRATION"
            )

          if (( ${#configuracoes_ausentes[@]} > 0 )); then
            echo "Existem configurações obrigatórias ausentes:"

            printf ' - %s\n' "${configuracoes_ausentes[@]}"

            echo "Configure os itens acima nas configurações do GitHub."
            exit 1
          fi

          echo "Secrets e Variables obrigatórios foram encontrados."

  validacao-segredos:
    name: CI / Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Impedir arquivos de ambiente reais versionados
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t arquivos_proibidos < <(
            git ls-files |
            grep -E '(^|/)\.env($|\.)' |
            grep -Ev '\.example$' || true
          )

          if (( ${#arquivos_proibidos[@]} > 0 )); then
            echo "Foram encontrados arquivos de ambiente reais:"
            printf ' - %s\n' "${arquivos_proibidos[@]}"

            echo "Mantenha versionados somente arquivos .env.example."
            exit 1
          fi

          echo "Nenhum arquivo de ambiente real está versionado."

      - name: Procurar segredos no histórico Git
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  testes-maven:
    name: CI / Testes Maven
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - validar-configuracao-ci
      - validacao-segredos

    env:
      SPRING_PROFILES_ACTIVE: "test"

      API_SECURITY_TOKEN_CHAVE_SECRETA: >-
        ${{ secrets.CI_JWT_SECRET }}

      API_WEBHOOK_FAKE_SECRET: >-
        ${{ secrets.CI_FAKE_WEBHOOK_SECRET }}

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Java 21 e cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"
          cache-dependency-path: "pom.xml"

      - name: Exibir versões das ferramentas
        shell: bash
        run: |
          set -euo pipefail

          java -version
          mvn -version

      - name: Executar testes automatizados
        run: mvn -B -ntp test

  empacotamento-maven:
    name: CI / Empacotamento Maven
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - testes-maven

    env:
      SPRING_PROFILES_ACTIVE: "test"

      API_SECURITY_TOKEN_CHAVE_SECRETA: >-
        ${{ secrets.CI_JWT_SECRET }}

      API_WEBHOOK_FAKE_SECRET: >-
        ${{ secrets.CI_FAKE_WEBHOOK_SECRET }}

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configurar Java 21 e cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"
          cache-dependency-path: "pom.xml"

      - name: Gerar o pacote da aplicação
        run: mvn -B -ntp clean package

      - name: Confirmar a geração do arquivo JAR
        shell: bash
        run: |
          set -euo pipefail

          jar_path="$(
            find target \
              -maxdepth 1 \
              -type f \
              -name 'api-de-pedidos-*.jar' \
              ! -name '*.original' \
              -print \
              -quit
          )"

          if [[ -z "$jar_path" ]]; then
            echo "O JAR executável não foi encontrado em target/."
            exit 1
          fi

          if [[ ! -s "$jar_path" ]]; then
            echo "O JAR foi encontrado, mas está vazio."
            exit 1
          fi

          echo "O JAR executável foi gerado com sucesso."

  validacao-compose:
    name: CI / Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - validar-configuracao-ci
      - validacao-segredos

    env:
      DB_NAME: ${{ vars.CI_DB_NAME }}
      DB_PORT: ${{ vars.CI_DB_PORT }}
      DB_USERNAME: ${{ vars.CI_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

      MONGO_DATABASE: ${{ vars.CI_MONGO_DATABASE }}
      MONGO_PORT: ${{ vars.CI_MONGO_PORT }}
      MONGO_USERNAME: ${{ vars.CI_MONGO_USERNAME }}
      MONGO_PASSWORD: ${{ secrets.CI_MONGO_PASSWORD }}
      MONGO_AUTHENTICATION_DATABASE: >-
        ${{ vars.CI_MONGO_AUTHENTICATION_DATABASE }}

      API_PORT: ${{ vars.CI_API_PORT }}

      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_EXPIRATION: ${{ vars.CI_JWT_EXPIRATION }}

      JWT_REFRESH_EXPIRATION: >-
        ${{ vars.CI_JWT_REFRESH_EXPIRATION }}

      JWT_RENEW_BEFORE_EXPIRATION: >-
        ${{ vars.CI_JWT_RENEW_BEFORE_EXPIRATION }}

      FAKE_WEBHOOK_SECRET: >-
        ${{ secrets.CI_FAKE_WEBHOOK_SECRET }}

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Exibir versão do Docker Compose
        run: docker compose version

      - name: Validar arquivos Docker Compose sem imprimir configuração
        shell: bash
        env:
          IMAGE_TAG: "latest"
          SPRING_PROFILES_ACTIVE: "homolog"
        run: |
          set -euo pipefail

          docker compose \
            --profile full \
            config \
            --quiet

          echo "docker-compose.yml validado com sucesso."

          docker compose \
            --file docker-compose.release.yml \
            config \
            --quiet

          echo "docker-compose.release.yml validado com sucesso."

  docker-build-seguranca:
    name: CI / Docker e Segurança
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - empacotamento-maven
      - validacao-compose

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Exibir versão do Docker
        run: docker version

      - name: Construir imagem Docker
        run: |
          docker build \
            --pull \
            --tag api-de-pedidos:ci \
            .

      - name: Confirmar que a imagem foi criada
        shell: bash
        run: |
          set -euo pipefail

          docker image inspect api-de-pedidos:ci > /dev/null

          echo "Imagem Docker criada com sucesso."

      - name: Confirmar execução sem usuário root
        shell: bash
        run: |
          set -euo pipefail

          usuario_imagem="$(
            docker image inspect \
              api-de-pedidos:ci \
              --format '{{.Config.User}}'
          )"

          if [[ -z "$usuario_imagem" ]]; then
            echo "A imagem não declarou um usuário de execução."
            exit 1
          fi

          if [[ "$usuario_imagem" == "root" ]]; then
            echo "A imagem está configurada para executar como root."
            exit 1
          fi

          if [[ "$usuario_imagem" == "0" ]]; then
            echo "A imagem está configurada com o usuário de ID zero."
            exit 1
          fi

          if [[ "$usuario_imagem" != "app" ]]; then
            echo "O usuário esperado para a imagem é app."
            exit 1
          fi

          echo "A imagem executa com usuário sem privilégios."

      - name: Verificar vulnerabilidades críticas da imagem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "api-de-pedidos:ci"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"
          scanners: "vuln"