global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "api-de-pedidos"
    metrics_path: "/actuator/prometheus"
    scheme: "http"

    static_configs:
      - targets:
          - "api-de-pedidos:8080"